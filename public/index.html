<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻将来了</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:radial-gradient(ellipse at 50% 0%,#2a1010 0%,#0d0505 60%);color:#eee;display:flex;flex-direction:column;align-items:center;padding:10px;min-height:100vh;overflow-y:auto}

.header{display:flex;gap:10px;padding:10px 18px;background:linear-gradient(180deg,rgba(42,21,32,.95),rgba(26,10,21,.98));border-radius:12px;margin-bottom:12px;flex-wrap:wrap;justify-content:center;align-items:center;border:1px solid rgba(212,168,67,.2)}
.stat{padding:5px 12px;background:rgba(0,0,0,.4);border-radius:8px;border:1px solid rgba(90,42,58,.5);font-size:13px;display:flex;align-items:center;gap:4px}
.stat b{color:#ffd700;font-size:16px}
.stat .uname{color:#4ecdc4;font-size:13px;font-weight:bold}
.top-btn{background:rgba(0,0,0,.5);border:1px solid rgba(212,168,67,.5);color:#d4a843;padding:5px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:bold;transition:all .2s}
.top-btn:hover{background:rgba(212,168,67,.15);border-color:#d4a843;transform:translateY(-1px)}
.top-btn.green{border-color:rgba(39,174,96,.5);color:#27ae60}
.top-btn.red{border-color:rgba(231,76,60,.5);color:#e74c3c}
.top-btn.gray{border-color:rgba(136,136,136,.5);color:#999}

.machine{background:linear-gradient(180deg,rgba(90,32,32,.9),rgba(58,21,21,.95));border-radius:20px;padding:20px;border:2px solid rgba(138,74,42,.4);display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.machine h2{color:#ffd700;letter-spacing:8px;font-size:22px;text-shadow:0 0 10px rgba(255,215,0,.3)}

.mul-bar{display:flex;gap:8px}
.mul{padding:5px 14px;border-radius:14px;background:rgba(0,0,0,.5);color:#555;border:2px solid rgba(58,42,26,.5);font-weight:bold;font-size:13px;transition:all .3s}
.mul.on{color:#fff;background:linear-gradient(180deg,#d4a843,#6b3a10);border-color:#ffd700;box-shadow:0 0 12px rgba(212,168,67,.5);transform:scale(1.05)}

.grid{position:relative;width:328px;height:312px;background:rgba(5,3,3,.9);padding:0;border-radius:12px;border:2px solid rgba(74,42,26,.5);overflow:hidden;box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}

.t{position:absolute;width:60px;height:72px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  background:linear-gradient(160deg,#fdfbf5 0%,#f5f1e5 25%,#ebe5d3 60%,#f3efe0 100%);
  border-radius:6px;cursor:pointer;overflow:hidden;user-select:none;
  box-shadow:2px 3px 6px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.1),inset 0 1px 2px rgba(255,255,255,.95),inset 0 -2px 3px rgba(0,0,0,.06);
  z-index:1}
.t .face{width:54px;height:66px;margin:3px;border-radius:4px;border:1.5px solid rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.t .char{font-size:28px;font-weight:900;font-family:'SimSun','KaiTi','Microsoft YaHei',serif;line-height:1;margin-top:4px;text-shadow:0 1px 1px rgba(0,0,0,.1)}
.t .sub{font-size:11px;font-weight:bold;margin-top:-2px;font-family:'SimSun','KaiTi',serif}
.t .dot{position:absolute;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.t .dot-inner{position:absolute;border-radius:50%}

.t.glow,.t.glow .face{background:linear-gradient(160deg,#fff8c0 0%,#ffe066 40%,#ffd700 100%)!important;box-shadow:0 0 20px rgba(255,200,0,.9),0 0 40px rgba(255,150,0,.5),0 0 0 2px #ff8c00!important;z-index:10;animation:pulse .5s ease infinite}
.t.glow .face{border-color:#ff8c00!important}
.t.glow .char,.t.glow .sub{color:#000!important}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

.bot{display:flex;align-items:center;gap:12px;margin-top:2px}
.msg{min-height:22px;font-size:14px;color:#ffd700;font-weight:bold;text-align:center;width:100%;text-shadow:0 0 8px rgba(255,215,0,.3)}
.spin{width:62px;height:62px;border-radius:50%;border:3px solid #ffd700;background:linear-gradient(180deg,#d4a843,#6b3a10);cursor:pointer;font-size:28px;color:#fff;display:flex;align-items:center;justify-content:center;transition:all .15s;box-shadow:0 4px 12px rgba(212,168,67,.3)}
.spin:hover{transform:scale(1.1);box-shadow:0 6px 20px rgba(212,168,67,.5)}
.spin:active{transform:scale(.95)}.spin:disabled{opacity:.4;transform:scale(1);box-shadow:none}
.bet{display:flex;align-items:center;gap:5px}
.bet button{width:28px;height:28px;border-radius:50%;border:2px solid #d4a843;background:rgba(0,0,0,.3);color:#d4a843;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.bet button:hover{background:#d4a843;color:#000}
.bet span{color:#ffd700;font-size:15px;min-width:44px;text-align:center;font-weight:bold}
.win-box{background:rgba(10,5,0,.6);border:2px solid rgba(90,58,26,.5);border-radius:12px;padding:8px 18px;min-width:100px;text-align:center}
.win-box .wl{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px}
.win-box .wv{font-size:22px;font-weight:bold;color:#555;transition:all .3s}
.win-box .wv.has{color:#ffd700;text-shadow:0 0 15px rgba(255,215,0,.6)}

/* Login Overlay */
#login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:3000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
#login-overlay .card{background:linear-gradient(180deg,rgba(42,21,32,.98),rgba(20,10,20,.98));border:2px solid rgba(212,168,67,.3);border-radius:20px;padding:36px;text-align:center;width:340px;box-shadow:0 0 40px rgba(212,168,67,.1)}
#login-overlay h2{color:#ffd700;margin-bottom:24px;font-size:22px;letter-spacing:4px}
#login-overlay input{width:100%;padding:12px;margin:6px 0;background:rgba(0,0,0,.4);border:1px solid rgba(90,42,58,.5);color:#eee;border-radius:8px;font-size:15px;outline:none;transition:border-color .2s}
#login-overlay input:focus{border-color:#d4a843}
#login-overlay .row-btn{display:flex;gap:10px;margin-top:16px}
#login-overlay .btn{flex:1;padding:12px;border:2px solid rgba(212,168,67,.5);background:transparent;color:#d4a843;border-radius:10px;cursor:pointer;font-size:14px;font-weight:bold;transition:all .2s}
#login-overlay .btn.primary{background:linear-gradient(180deg,#d4a843,#8b4513);color:#000;border-color:#ffd700}
#login-overlay .btn:hover{opacity:.85;transform:translateY(-1px)}
#login-overlay .err{color:#e74c3c;font-size:12px;margin-top:10px;min-height:20px}

/* Leaderboard */
#lb-panel{position:fixed;top:0;right:0;width:320px;height:100vh;background:rgba(20,10,15,.98);border-left:2px solid rgba(212,168,67,.3);z-index:2500;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:20px;backdrop-filter:blur(8px)}
#lb-panel.show{transform:translateX(0)}
#lb-panel h3{color:#ffd700;text-align:center;margin-bottom:16px;font-size:16px;letter-spacing:2px}
#lb-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:2px solid rgba(212,168,67,.5);background:transparent;color:#d4a843;font-size:16px;cursor:pointer;transition:all .2s}
#lb-close:hover{background:rgba(212,168,67,.2)}
#lb-panel .user{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid rgba(90,42,58,.2);font-size:13px;transition:background .2s}
#lb-panel .user:hover{background:rgba(212,168,67,.05)}
#lb-panel .user .rank{color:#666;width:28px;text-align:center;font-size:16px;font-weight:bold}
#lb-panel .user .rank.gold{color:#ffd700}
#lb-panel .user .rank.silver{color:#c0c0c0}
#lb-panel .user .rank.bronze{color:#cd7f32}
#lb-panel .user .name{flex:1;color:#ccc}
#lb-panel .user .rtp{font-weight:bold}
#lb-panel .user .rtp.pos{color:#27ae60}
#lb-panel .user .rtp.neg{color:#e74c3c}

/* Withdraw */
#wd-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:4000;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
#wd-overlay.show{display:flex}
#wd-overlay .big-text{font-size:34px;font-weight:bold;color:#e74c3c;text-shadow:0 0 30px rgba(231,76,60,.6);line-height:1.6;animation:shake .5s ease-in-out}
#wd-overlay .close-wd{position:absolute;top:24px;right:24px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(231,76,60,.5);background:transparent;color:#e74c3c;font-size:22px;cursor:pointer;transition:all .2s}
#wd-overlay .close-wd:hover{background:rgba(231,76,60,.2)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}

/* Big Win */
#bigwin{position:fixed;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;z-index:2000}
#bigwin.show{display:flex}
#bigwin .bg{position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at center,rgba(255,215,0,.3) 0%,rgba(0,0,0,.9) 100%);animation:bigPulse 1.2s ease-in-out infinite}
@keyframes bigPulse{0%,100%{opacity:.6}50%{opacity:1}}
#bigwin .card{position:relative;z-index:2;background:linear-gradient(180deg,rgba(58,26,10,.98) 0%,rgba(26,8,0,.98) 50%,rgba(58,26,10,.98) 100%);border:3px solid #ffd700;border-radius:28px;padding:36px 70px;text-align:center;box-shadow:0 0 80px rgba(212,168,67,.5),0 0 160px rgba(255,150,0,.3),inset 0 1px 0 rgba(255,255,255,.1);transform:scale(0);animation:bigPop .6s cubic-bezier(.17,.67,.35,1.5) .15s forwards}
@keyframes bigPop{0%{transform:scale(0) rotate(-10deg)}60%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
#bigwin .icon{font-size:52px;margin-bottom:6px}
#bigwin .title{font-size:38px;font-weight:900;color:#ffd700;text-shadow:0 0 24px gold;letter-spacing:8px}
#bigwin .multi{font-size:80px;font-weight:900;color:#fff;text-shadow:0 0 40px rgba(255,255,255,.7),0 0 80px gold;margin:10px 0;animation:multiPulse .8s ease-in-out infinite}
@keyframes multiPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#bigwin .coins{font-size:22px;color:#ffd700;text-shadow:0 0 15px rgba(255,215,0,.6)}
#bigwin .line{width:80%;height:2px;background:linear-gradient(90deg,transparent,#d4a843,transparent);margin:16px auto}

.particle{position:fixed;pointer-events:none;z-index:2001;border-radius:50%;animation:particleFall linear forwards}
@keyframes particleFall{0%{opacity:1;transform:translateY(0) rotate(0) scale(1)}100%{opacity:0;transform:translateY(100vh) rotate(720deg) scale(.3)}}

/* ===== Prize Wheel ===== */
#pwheel{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);z-index:3500;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px}
#pwheel.show{display:flex}
#pwheel .title2{color:#ffd700;font-size:24px;font-weight:bold;text-shadow:0 0 15px gold;letter-spacing:4px}
#pwheel .result{width:120px;height:120px;border:3px solid #ffd700;border-radius:20px;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;color:#ffd700;text-shadow:0 0 20px gold}
#pwheel .spinning .result-item{position:absolute;font-size:36px;font-weight:bold;opacity:0}
#pwheel .spinning .result-item.show{opacity:1;animation:spinFlash .1s steps(1) infinite}
@keyframes spinFlash{0%,100%{opacity:1}50%{opacity:.3}}
#pwheel .btn2{padding:12px 40px;border:2px solid #ffd700;background:linear-gradient(180deg,#d4a843,#6b3a10);color:#fff;border-radius:10px;cursor:pointer;font-size:16px;font-weight:bold}
#pwheel .btn2:hover{opacity:.8}
#pwheel .info{color:#ccc;font-size:13px}

/* ===== Free Spin Banner ===== */
.fs-banner{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#ffd700,#8b4513);color:#000;padding:8px 30px;border-radius:20px;z-index:2100;font-weight:bold;font-size:15px;letter-spacing:2px;box-shadow:0 4px 15px rgba(255,215,0,.4)}

/* ===== Progress Bar ===== */
.prog-bar{position:fixed;left:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:40px;z-index:500}
.prog-bar .pb-track{width:8px;height:300px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;position:relative}
.prog-bar .pb-fill{position:absolute;bottom:0;left:0;width:100%;background:linear-gradient(180deg,#27ae60,#2ecc71);transition:height .5s;border-radius:4px}
.prog-bar .pb-text{color:#888;font-size:9px;text-align:center;line-height:1.2}
.prog-bar .pb-num{color:#27ae60;font-size:11px;font-weight:bold}

/* ===== Tutorial Toast ===== */
.tutorial{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);border:2px solid #ffd700;color:#ffd700;padding:16px 28px;border-radius:12px;z-index:5000;font-size:16px;font-weight:bold;letter-spacing:2px;animation:toastIn .4s ease,toastOut .4s ease 2.5s forwards}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes toastOut{0%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}

/* ===== Spinning Wheel ===== */
#pwheel .wheel-wrap{position:relative;width:260px;height:260px}
#pwheel .wheel-svg{width:100%;height:100%;transform-origin:50% 50%;transition:transform 4s cubic-bezier(.17,.67,.12,.99)}
#pwheel .wheel-pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid #ffd700;z-index:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
</style>
</head>
<body>

<div id="login-overlay">
  <div class="card">
    <h2>麻 将 来 了</h2>
    <input type="text" id="login-user" placeholder="用户名">
    <input type="password" id="login-pw" placeholder="密码">
    <div class="row-btn">
      <button class="btn" onclick="doLogin()">登录</button>
      <button class="btn primary" onclick="doRegister()">注册</button>
    </div>
    <div class="err" id="login-err"></div>
  </div>
</div>

<!-- Progress Bar -->
<div class="prog-bar">
  <div class="pb-num" id="pb-next">88888</div>
  <div class="pb-track"><div class="pb-fill" id="pb-fill" style="height:0%"></div></div>
  <div class="pb-text" id="pb-info">下注<br>进度</div>
</div>

<div class="header">
  <div class="stat">👤 <span class="uname" id="h-name">未登录</span></div>
  <div class="stat">💰 <b id="bal">10000</b></div>
  <div class="stat">🎯 <b id="bdisp">100</b></div>
  <div class="stat">🎰 <b id="combo">x1</b></div>
  <div class="stat">🔄 <b id="cnt">0</b>次</div>
  <button class="top-btn" onclick="toggleLB()">🏆 排行榜</button>
  <button class="top-btn green" onclick="doRecharge()">💳 充值</button>
  <button class="top-btn red" onclick="showWithdraw()">💸 提现</button>
  <button class="top-btn gray" onclick="doLogout()">🚪 退出</button>
</div>

<div class="machine">
  <h2>麻 将 来 了</h2>
  <div class="mul-bar">
    <div class="mul on" id="m1">x1</div>
    <div class="mul" id="m2">x2</div>
    <div class="mul" id="m3">x3</div>
    <div class="mul" id="m5">x5</div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg"></div>
  <div class="bot">
    <div class="bet"><button onclick="chBet(-1)">-</button><span id="bs">100</span><button onclick="chBet(1)">+</button></div>
    <div class="win-box"><div class="wl">本局收益</div><div class="wv" id="spin-win">0</div></div>
    <button class="spin" id="spinBtn" onclick="spin()">⟳</button>
  </div>
</div>

<div id="lb-panel">
  <button id="lb-close" onclick="toggleLB()">✕</button>
  <h3>🏆 收益率排行榜</h3>
  <div id="lb-list"></div>
</div>

<div id="wd-overlay">
  <button class="close-wd" onclick="hideWithdraw()">✕</button>
  <div class="big-text">一毛钱不充还想提现<br>你当我是开银行的？</div>
</div>

<div id="pwheel">
  <div class="title2" id="pw-title">🎰 里程碑大奖</div>
  <div class="wheel-wrap">
    <div class="wheel-pointer"></div>
    <svg class="wheel-svg" id="wheel-svg" viewBox="0 0 260 260"></svg>
  </div>
  <div class="info" id="pw-info"></div>
  <button class="btn2" id="pw-btn" onclick="startPrizeSpin()" style="display:none">点击抽奖</button>
</div>

<div id="bigwin">
  <div class="bg"></div>
  <div class="card">
    <div class="icon" id="bw-icon">🎰</div>
    <div class="title" id="bw-title">大 奖</div>
    <div class="line"></div>
    <div class="multi" id="bw-multi"></div>
    <div class="line"></div>
    <div class="coins" id="bw-coins"></div>
  </div>
</div>

<script>
const ROWS=4,COLS=5,GAP=3,TW=60,TH=72;
const TYPES=[
  {id:'1T',n:'一筒',c:'dot',v:1,p:{3:0.3,4:1,5:3}},
  {id:'2T',n:'二筒',c:'dot',v:2,p:{3:0.3,4:1,5:3}},
  {id:'5T',n:'五筒',c:'dot',v:5,p:{3:0.5,4:2,5:6}},
  {id:'9T',n:'九筒',c:'dot',v:9,p:{3:1,4:4,5:15}},
  {id:'1B',n:'一条',c:'bam',v:1,p:{3:0.3,4:1,5:3}},
  {id:'2B',n:'二条',c:'bam',v:2,p:{3:0.3,4:1,5:3}},
  {id:'5B',n:'五条',c:'bam',v:5,p:{3:0.5,4:2,5:6}},
  {id:'9B',n:'九条',c:'bam',v:9,p:{3:1,4:4,5:15}},
  {id:'1W',n:'一万',c:'wan',v:1,p:{3:0.3,4:1,5:3}},
  {id:'2W',n:'二万',c:'wan',v:2,p:{3:0.3,4:1,5:3}},
  {id:'5W',n:'五万',c:'wan',v:5,p:{3:0.5,4:2,5:6}},
  {id:'9W',n:'九万',c:'wan',v:9,p:{3:1,4:4,5:15}},
  {id:'Z',n:'红中',c:'zhong',v:0,p:{3:2,4:8,5:40}},
  {id:'F',n:'发财',c:'fa',v:0,p:{3:2,4:8,5:40}},
  {id:'B',n:'白板',c:'bai',v:0,p:{3:2,4:8,5:40}},
  {id:'X',n:'爆',c:'bomb',v:0,p:{3:5,4:20,5:80}},
];

let activeTileIds=[],activeMul=[1,2,3,5];
let token='',username='';
let balance=10000,bet=100,cnt=0;

// ========== Auth with localStorage ==========
function api(url,opts={}){
  if(!opts.headers)opts.headers={};
  if(token)opts.headers['x-token']=token;
  return fetch(url,opts);
}

function saveAuth(){localStorage.setItem('mj_token',token);localStorage.setItem('mj_user',username)}
function loadAuth(){
  token=localStorage.getItem('mj_token')||'';
  username=localStorage.getItem('mj_user')||'';
  if(token&&username){
    document.getElementById('login-overlay').style.display='none';
    document.getElementById('h-name').textContent=username;
    refreshBalance();
    loadConfig().then(()=>initAndRender());
    refreshLB();
    return true;
  }
  return false;
}
function clearAuth(){localStorage.removeItem('mj_token');localStorage.removeItem('mj_user');token='';username='';}

async function doLogin(){
  const u=document.getElementById('login-user').value.trim();
  const p=document.getElementById('login-pw').value;
  if(!u||!p){document.getElementById('login-err').textContent='请输入用户名和密码';return}
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(r.ok){token=d.token;username=u;balance=d.balance;saveAuth();onLogin()}else{document.getElementById('login-err').textContent=d.error}
  }catch(e){document.getElementById('login-err').textContent='网络错误'}
}

async function doRegister(){
  const u=document.getElementById('login-user').value.trim();
  const p=document.getElementById('login-pw').value;
  if(!u||!p){document.getElementById('login-err').textContent='请输入用户名和密码';return}
  try{
    const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(r.ok){token=d.token;username=u;balance=d.balance;saveAuth();onLogin()}else{document.getElementById('login-err').textContent=d.error}
  }catch(e){document.getElementById('login-err').textContent='网络错误'}
}

function findClusters(){
  const vis=new Set(),out=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const k=r*COLS+c;if(vis.has(k)||!grid[r][c]||grid[r][c]==='X')continue;
    const tp=grid[r][c],q=[[r,c]],cl=[];
    while(q.length){
      const[cr,cc]=q.shift(),ck=cr*COLS+cc;
      if(vis.has(ck)||cr<0||cr>=ROWS||cc<0||cc>=COLS||grid[cr][cc]!==tp)continue;
      vis.add(ck);cl.push([cr,cc]);q.push([cr-1,cc],[cr+1,cc],[cr,cc-1],[cr,cc+1]);
    }
    if(cl.length>=3)out.push({id:tp,ps:cl});
  }
  return out;
}

async function doCascade(gridEl,spinBet,isFree){
  let thisSpinWin=0,cc=0;
  while(true){
    const cls=findClusters();if(!cls.length)break;
    cc++;mi=Math.min(cc-1,activeMul.length-1);updateMul();
    document.getElementById('combo').textContent='x'+activeMul[mi];
    const deadSet=new Set();
    cls.forEach(cl=>cl.ps.forEach(([r,c])=>{deadSet.add(r+','+c);const el=gridEl.querySelector('.t[data-r="'+r+'"][data-c="'+c+'"]');if(el)el.classList.add('glow')}));
    const bp=Math.max(...cls.map(cl=>pay(cl.id,cl.ps.length)));
    const tw=(isFree?bp*spinBet*activeMul[mi]*freeSpinMultiplier:bp*spinBet*activeMul[mi]);
    document.getElementById('msg').textContent=tw>0?'+'+tw:'';
    if(tw>0)sndWin();
    await slp(850);
    sndElim();
    const deadEls=[];
    deadSet.forEach(k=>{const[r,c]=k.split(',').map(Number);grid[r][c]=null;const el=gridEl.querySelector('.t[data-r="'+r+'"][data-c="'+c+'"]');if(el){el.classList.remove('glow');el.style.transition='opacity .3s, transform .3s';el.style.opacity='0';el.style.transform='scale(0.3)';deadEls.push(el)}});
    for(let c=0;c<COLS;c++){
      const survivors=[];for(let r=0;r<ROWS;r++){if(grid[r][c]!==null){const el=gridEl.querySelector('.t[data-r="'+r+'"][data-c="'+c+'"]');if(el)survivors.push({id:grid[r][c],el,fromR:r})}}
      const emptySlots=ROWS-survivors.length;
      survivors.forEach((s,i)=>{const newR=emptySlots+i;grid[newR][c]=s.id;s.el.dataset.r=newR;s.el.style.transition='top .38s cubic-bezier(.4,0,.2,1) '+(c*15)+'ms';s.el.style.top=tileY(newR)+'px'});
      for(let r=0;r<emptySlots;r++){const nid=pick();grid[r][c]=nid;const d=makeTileEl(nid,r,c);d.style.left=tileX(c)+'px';d.style.top=(-TH-(emptySlots-1-r)*50)+'px';d.style.opacity='0';gridEl.appendChild(d);d.offsetHeight;const delay=(emptySlots-1-r)*40+c*15;d.style.transition='top .42s cubic-bezier(.2,.8,.3,1.05) '+delay+'ms, opacity .28s ease '+delay+'ms';d.style.top=tileY(r)+'px';d.style.opacity='1'}
    }
    sndDrop();
    balance+=tw;thisSpinWin+=tw;
    updateWinDisplay(thisSpinWin);
    await slp(450);
    deadEls.forEach(el=>el.remove());
  }
  return thisSpinWin;
}

function drawWheel(){

    const x2=r+Math.cos(a2*Math.PI/180)*r,y2=r+Math.sin(a2*Math.PI/180)*r;

  }
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)grid[r][c]=newGrid[r][c];
  await slp(550+ROWS*25+COLS*30);
  oldTiles.forEach(el=>el.remove());

  thisSpinWin=await doCascade(gridEl,spinBet,freeSpinMode);

  // Check for "爆" bomb trigger (normal mode only)
  if(!freeSpinMode){
    const bombCount=countBombs(grid);
    if(bombCount>0&&!bombShown){bombShown=true;showToast('💥 转到三个"爆"字即可触发十次免费旋转!')}
    if(bombCount>=3){
      await slp(400);
      document.getElementById('msg').textContent='💥 爆! x'+bombCount+'个';
      await slp(600);
      await startFreeSpins(10,1,bet,'爆!');
    }
  }

  // Report and milestones
  if(!freeSpinMode){
    const ms=await reportSpin(spinBet,thisSpinWin);
    totalBetAmt+=spinBet;totalSpins++;
    if(ms&&ms>0){nextMS=ms+200000}else{updateStats()}
    if(ms&&ms>0){
      await slp(300);
      document.getElementById('pw-title').textContent='🎰 累计投注'+ms+'里程碑';
      const wheelBet=await new Promise(resolve=>{showPrizeWheel(resolve)});
      if(wheelBet){
        await slp(300);
        await startFreeSpins(8,1,wheelBet,'里程碑');
      }
    }
  }

  if(!freeSpinMode&&thisSpinWin>=spinBet*10){sndBigWin();await showBigWin(thisSpinWin,Math.round(thisSpinWin/spinBet))}

  }catch(e){console.error(e)}finally{
    document.getElementById('spinBtn').disabled=false;
    busy=false;
  }
  updateStats();
  if(token)refreshLB();
}

function updateMul(){activeMul.forEach((v,i)=>{const el=document.getElementById('m'+[1,2,3,5][i]);if(el){el.textContent='x'+v;el.className='mul'+(i===mi?' on':'')}})}
function updateStats(){
  document.getElementById('bal').textContent=balance;
  document.getElementById('bdisp').textContent=bet;
  document.getElementById('bs').textContent=bet;
  document.getElementById('cnt').textContent=totalSpins;
  updatePBar();
}
function updatePBar(){
  const pct=Math.min(100,Math.round(totalBetAmt/nextMS*100));
  document.getElementById('pb-fill').style.height=pct+'%';
  document.getElementById('pb-next').textContent=nextMS;
  document.getElementById('pb-info').innerHTML='投注<br>'+pct+'%';
}
function chBet(d){sndBet();const s=d===1;if(s){bet=bet<100?Math.min(100,bet+10):bet<1000?Math.min(1000,bet+100):Math.min(5000,bet+1000)}else{bet=bet<=100?Math.max(10,bet-10):bet<=1000?Math.max(100,bet-100):Math.max(1000,bet-1000)};document.getElementById('bs').textContent=bet}

function initAndRender(){
  grid=[];for(let r=0;r<ROWS;r++){grid[r]=[];for(let c=0;c<COLS;c++)grid[r][c]=pick()}
  const el=document.getElementById('grid');el.innerHTML='';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const d=makeTileEl(grid[r][c],r,c);d.style.left=tileX(c)+'px';d.style.top=tileY(r)+'px';el.appendChild(d)}
  updateStats();
}

if(!loadAuth()){loadConfig().then(()=>initAndRender())}
</script>
